version: 2

# Version updates come once a quarter as at most two PRs per ecosystem: one
# for minor/patch (auto-merged when CI passes, by the dependabot-automerge job
# in workflows/ci.yml) and one for majors (merged by hand). Small regular steps
# keep a major from turning into a migration. Security updates ignore the
# schedule, the groups and the cooldown: they open straight away, one PR per
# advisory.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "quarterly"
      time: "06:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    # Skip releases younger than a week: bad releases are usually yanked or patched
    # by then.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
      time: "06:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
